<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="darkreader-lock">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080808">
  <script>
    try {
      if (localStorage.getItem('portfolio-theme-v2') === 'light') {
        document.documentElement.dataset.theme = 'light'
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'only light')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f7f3')
      }
    } catch {
      // Use the black theme when browser storage is unavailable.
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Explore Tasnima Akther Tisha's full-stack development projects, skills, and contact information.">
  <title>Tasnima Akther Tisha | Full-Stack Developer</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
